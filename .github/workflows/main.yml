name: Backend Health Check

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check actuator health
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            https://erp-0mee.onrender.com/actuator/health

