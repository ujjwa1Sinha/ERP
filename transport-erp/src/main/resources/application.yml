spring:
  application:
    name: transport-erp

  datasource:
    url: jdbc:postgresql://db.yrlulcoedvhthzwsxhes.supabase.co:5432/postgres?prepareThreshold=0
    username: postgres
    password: Transporterp@63917
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
    repair-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 2MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8081
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# App Configuration
app:
  upload:
    dir: ./uploads/documents

  jwt:
    # Secret must be base64 encoded and at least 256-bit (e.g. 32 bytes)
    secret: ${JWT_SECRET:ZGVmYXVsdC1qd3Qtc2VjcmV0LWtleS12ZXJ5LWxvbmctYW5kLXNlY3VyZTEyMw==}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

logging:
  level:
    com.transport.erp: INFO
    org.springframework.security: INFO

supabase:
  url: ${SUPABASE_URL:https://yrlulcoedvhthzwsxhes.supabase.co}
  s3:
    endpoint: ${SUPABASE_S3_ENDPOINT:https://yrlulcoedvhthzwsxhes.supabase.co/storage/v1/s3}
    region: ${SUPABASE_S3_REGION:ap-northeast-1}
    bucket: ${SUPABASE_S3_BUCKET:documents} # Change 'documents' to whatever you named your bucket
    access-key: ${SUPABASE_S3_ACCESS_KEY:dummy-access-key}
    secret-key: ${SUPABASE_S3_SECRET_KEY:dummy-secret-key}

management:
  security:
    username: ${ACTUATOR_USERNAME:prometheus}
    password: ${ACTUATOR_PASSWORD:changeme}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

