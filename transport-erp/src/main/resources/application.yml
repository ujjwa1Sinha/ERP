spring:
  application:
    name: transport-erp

  datasource:
    url: jdbc:postgresql://db.yrlulcoedvhthzwsxhes.supabase.co:5432/postgres?prepareThreshold=0
    username: postgres
    password: Transporterp@63917
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
    repair-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration

  # Redis disabled for local development (no Redis installed)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 2MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8081

# App Configuration
app:
  upload:
    dir: ./uploads/documents

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

logging:
  level:
    com.transport.erp: DEBUG
    org.springframework.security: INFO