spring:
  application:
    name: transport-erp

  datasource:
    url: jdbc:postgresql://localhost:5432/transport_erp
    username: postgres
    password: ujjwal1060
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
    repair-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration

  # Redis disabled for local development (no Redis installed)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 2MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8081

# App Configuration
app:
  upload:
    dir: ./uploads/documents
  jwt:
    secret: dGhpcy1pcy1hLXZlcnktc2VjdXJlLWp3dC1zZWNyZXQta2V5LWZvci10cmFuc3BvcnQtZXJwLXN5c3RlbS0yMDI0
    expiration-ms: 86400000   # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

logging:
  level:
    com.transport.erp: DEBUG
    org.springframework.security: INFO
