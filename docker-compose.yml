services:
  # ─── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: transport-erp-postgres
    env_file:
      - credentials.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transport-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── pgAdmin (Database UI) ─────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: transport-erp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@transport.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - type: bind
        source: C:/ERP-backups
        target: /var/lib/pgadmin/storage/admin_transport.com
    networks:
      - transport-network
    depends_on:
      - postgres
    restart: unless-stopped

  # ─── Spring Boot Backend ───────────────────────────────────────
  backend:
    build:
      context: ./transport-erp
      dockerfile: Dockerfile
    container_name: transport-erp-backend
    env_file:
      - credentials.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8081:8081"
    volumes:
      - upload_data:/app/uploads/documents
    networks:
      - transport-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── React Frontend (Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./transport-erp-ui
      dockerfile: Dockerfile
    container_name: transport-erp-frontend
    ports:
      - "80:80"
    networks:
      - transport-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
  pgadmin_data:

networks:
  transport-network:
    driver: bridge
